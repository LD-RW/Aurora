services:
  mysql:
    image: mysql:8.4
    container_name: aurora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aurora
      MYSQL_USER: aurora
      MYSQL_PASSWORD: aurora
    ports:
      - "3306:3306"
    volumes:
      - aurora-mysql-data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: aurora-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  aurora-mysql-data:
