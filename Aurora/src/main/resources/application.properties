spring.application.name=Aurora
project.image = images/

spring.h2.console.enabled=true

spring.datasource.url = jdbc:h2:mem:test

# Base64-encoded 512-bit key (>= 256 bits required by RFC 7518 for HMAC-SHA).
# Overridable via the JWT_SECRET env var; the committed value is for local dev only.
spring.app.jwtSecret = ${JWT_SECRET:uODxQoBhKCpA5o4wCLu3msECRmROSVMF4czJABTrM838ToexMeyPLDBTDLGSmvYP7bvZq2xNlr5fiO8XJlm6qA==}
spring.app.jwtExpirationMS = ${JWT_EXPIRATION_MS:300000}
spring.app.jwtCookieName = SpringBootEcommerceProject

# Default admin account seeded on startup if it doesn't already exist.
# Overridable via env vars; the committed defaults are for local dev only.
spring.app.admin.username = ${ADMIN_USERNAME:admin}
spring.app.admin.password = ${ADMIN_PASSWORD:admin123}
spring.app.admin.email = ${ADMIN_EMAIL:admin@aurora.local}